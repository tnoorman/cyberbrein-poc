name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: cyberbrein_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cyberbrein_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CYBERBREIN_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/cyberbrein_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting with Ruff
        run: ruff format --check src tests

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Run tests
        run: pytest -q
